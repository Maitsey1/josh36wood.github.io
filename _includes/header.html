{%- assign s = site.data.site -%}
<header class="bar">
<a class="brand" href="/"><span class="mark" aria-hidden="true">36</span><span>Josh Wood</span></a>
<button class="menubtn" type="button" aria-expanded="false" aria-controls="mainnav" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
<nav class="nav" id="mainnav" aria-label="Main">
{%- for n in s.nav %}<a href="{{ n.url }}">{{ n.label }}</a>{% endfor %}
<a class="cta" href="{{ s.nav_button.url }}">{{ s.nav_button.label }}</a>
</nav>
</header>
<script>
(function(){var d=document.documentElement;d.classList.add("js");var b=document.querySelector(".menubtn");if(!b)return;b.hidden=false;
b.addEventListener("click",function(){var o=d.classList.toggle("menu-open");b.setAttribute("aria-expanded",o)});
document.querySelectorAll("#mainnav a").forEach(function(a){a.addEventListener("click",function(){d.classList.remove("menu-open");b.setAttribute("aria-expanded","false")})});})();
</script>
