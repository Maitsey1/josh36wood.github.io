about:
  text: "Josh Wood has finished school and now races full-time. He trains with SPN Academy under coach Nico Ferreira and competes across Europe. In 2024 he was one of around 120 riders invited to the Red Bull MotoGP Rookies Cup Selection Event. His objective for 2027 is a full European championship programme."
