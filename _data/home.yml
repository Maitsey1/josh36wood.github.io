    - {label: "Based in", text: "Málaga, Spain"}
    - {label: "Trains with", text: "SPN Academy, under coach Nico Ferreira"}
    - {label: "Selected", text: "2024 Red Bull MotoGP Rookies Cup Selection Event, one of around 120 riders worldwide"}
    - {label: "Working toward", text: "2027: a full European championship programme"}
  link: {label: Read the full story, url: "/#story"}
