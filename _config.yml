title: Josh Wood
description: Josh Wood, seventeen, American, racing championships across Europe.
url: "https://josh36wood.com"
baseurl: ""
lang: en
timezone: Europe/Madrid
author: Josh Wood
twitter:
  username:
social:
  name: Josh Wood
  links:
    - https://www.instagram.com/josh.wood36/
image: /og_image.jpg

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

permalink: /journey/:year/:month/:title/
collections:
  journey:
    output: true
    permalink: /journey/:name/
defaults:
  - scope: {path: ""}
    values: {lang: en}

# Keep the existing static pages and media published; skip build tooling.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - README.md
  - vendor
  - .claude
